name: PROJECT-NAS Runtime Smoke

on: [push, pull_request]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PROJECT_NAS_DOCTOR_OFFLINE: "1"
  PROJECT_NAS_MEMORY_DB: ${{ github.workspace }}/.ci-runtime/memory.sqlite3
  PROJECT_NAS_OLLAMA_MODEL: llama3.2:3b

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create isolated Python environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -r requirements-test.txt
          .ci-venv/bin/python -m pip install -r requirements-runtime.txt

      - name: Prepare local-only mock dependencies
        run: |
          mkdir -p .ci-runtime
          .ci-venv/bin/python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path('.ci-runtime/memory.sqlite3')
          with sqlite3.connect(path) as conn:
              conn.execute('CREATE TABLE memories (id INTEGER PRIMARY KEY, document TEXT)')
              conn.execute('INSERT INTO memories (document) VALUES (?)', ('CI smoke memory',))
              conn.commit()
          PY
          cat > .ci-runtime/mock_local_services.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def _send(self, status, payload):
                  raw = json.dumps(payload).encode()
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(raw)))
                  self.end_headers()
                  self.wfile.write(raw)

              def do_GET(self):
                  if self.server.server_port == 11434 and self.path == '/api/tags':
                      self._send(200, {'models': [{'name': 'llama3.2:3b'}]})
                  elif self.server.server_port == 5000 and self.path == '/health':
                      self._send(200, {'status': 'healthy'})
                  else:
                      self._send(404, {'error': 'not found'})

              def do_POST(self):
                  if self.server.server_port == 5000 and self.path == '/chat':
                      length = int(self.headers.get('Content-Length', '0'))
                      json.loads(self.rfile.read(length))
                      self._send(200, {'response': 'local runtime smoke ok'})
                  else:
                      self._send(404, {'error': 'not found'})

              def log_message(self, *_):
                  pass

          for port in (5000, 11434):
              server = ThreadingHTTPServer(('127.0.0.1', port), Handler)
              import threading
              threading.Thread(target=server.serve_forever, daemon=True).start()
          threading.Event().wait()
          PY
          nohup .ci-venv/bin/python .ci-runtime/mock_local_services.py > .ci-runtime/mock.log 2>&1 &
          echo $! > .ci-runtime/mock.pid
          for url in http://127.0.0.1:5000/health http://127.0.0.1:11434/api/tags; do
            for _ in $(seq 1 20); do curl -fsS "$url" >/dev/null && break; sleep 1; done
            curl -fsS "$url" >/dev/null
          done

      - name: Exercise runtime lifecycle and canonical chat path
        run: |
          runtime/project-nas.sh start
          runtime/project-nas.sh status
          curl -fsS http://127.0.0.1:5001/health | .ci-venv/bin/python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"] == "healthy", p'
          curl -fsS -X POST http://127.0.0.1:5001/chat -H 'Content-Type: application/json' -d '{"prompt":"hello","context":"CI"}' | .ci-venv/bin/python -c 'import json,sys; p=json.load(sys.stdin); assert p["response"] == "local runtime smoke ok", p'
          runtime/project-nas.sh doctor

      - name: Stop runtime and verify backend is gone
        run: |
          kill "$(cat .ci-runtime/mock.pid)"
          runtime/project-nas.sh stop
          if curl -fsS http://127.0.0.1:5001/health >/dev/null 2>&1; then
            echo 'Backend remained reachable after stop' >&2
            exit 1
          fi
