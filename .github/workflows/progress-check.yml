name: PROJECT-NAS Progress Check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  progress-check:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Git and test/runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install -r requirements-runtime.txt

      - name: Initialize repository metadata for container checks
        run: |
          git init -q
          git config user.name "PROJECT-NAS CI"
          git config user.email "ci@project-nas.local"
          git switch -c "${GITHUB_REF_NAME}"
          git add -A

      - name: Check repository whitespace
        run: git diff --cached --check

      - name: Compile Python sources
        run: python -m compileall -q runtime tests

      - name: Check shell syntax
        run: bash -n runtime/project-nas.sh

      - name: Run full test suite
        run: pytest -q tests

      - name: Run PROJECT-NAS doctor diagnostics
        run: python runtime/doctor.py

      - name: Commit CI snapshot for repository readers
        run: git commit -qm "ci: verification snapshot"

      - name: Run progress reporter
        run: |
          python runtime/progress.py --commits 5 > progress.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("progress.json").read_text(encoding="utf-8"))
          repo = payload["repo"]
          assert repo["branch"] == os.environ["GITHUB_REF_NAME"]
          assert repo["recent_commits"]
          print(f"CI progress check OK: branch={repo['branch']}, commits={len(repo['recent_commits'])}")
          PY
