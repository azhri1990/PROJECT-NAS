<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-NAS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0b0e11; color: #e8edf3; height: 100vh; display: flex; flex-direction: column; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 16px; border-radius: 16px; word-wrap: break-word; }
        .user { align-self: flex-end; background: #2b6cff; }
        .bot { align-self: flex-start; background: #1e242c; }
        .input-area { display: flex; padding: 12px; background: #151e24; border-top: 1px solid #2a333c; }
        #input { flex: 1; padding: 10px; border: none; border-radius: 24px; background: #1e242c; color: #fff; outline: none; }
        #send { margin-left: 10px; padding: 10px 20px; background: #2b6cff; border: none; border-radius: 24px; color: #fff; cursor: pointer; }
        #send:hover { background: #1a56d6; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input id="input" placeholder="Talk to Jarvis..." />
        <button id="send">Send</button>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                addMessage(data.response || 'No response', 'bot');
            } catch (e) {
                addMessage('Error connecting to backend.', 'bot');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
